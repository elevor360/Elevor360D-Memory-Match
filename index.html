<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#175baf"><link rel="manifest" href="manifest.json"><title>Elevor360D Memory Match</title><style>*{box-sizing:border-box}body{margin:0;background:#e6f5ff;color:#15365b;font:16px system-ui;text-align:center}main{max-width:850px;margin:auto;padding:12px}header{background:#175baf;color:white;padding:15px;border-radius:20px}h1{margin:5px;color:#ffe66b}button,select{font:inherit;padding:10px;border:0;border-radius:12px}button{background:#175baf;color:white;font-weight:bold;cursor:pointer}select{background:white;color:#15365b;border:1px solid #aac}section{background:white;border-radius:16px;padding:12px;margin:12px 0}.controls{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;align-items:center}#board{display:grid;gap:7px;margin:12px auto;max-width:720px}.tile{aspect-ratio:1;padding:0;font-size:clamp(20px,6vw,46px);background:linear-gradient(145deg,#379cff,#174399);box-shadow:0 3px #123c74}.tile.open{background:#fff2a7;color:#123;box-shadow:0 3px #d5ad47}.tile.matched{background:#b8edbd;color:#123;box-shadow:0 3px #70b982}.tile:disabled{opacity:1}dialog{border:0;border-radius:24px;padding:28px;max-width:90%;text-align:center;background:#fff6c6;color:#15365b}dialog::backdrop{background:#1239}.star{font-size:70px;animation:bounce .7s infinite alternate}@keyframes bounce{to{transform:translateY(-12px) rotate(8deg)}}@media(prefers-reduced-motion:reduce){.star{animation:none}}</style></head><body><main><header><button id="install" style="float:right;background:#fff;color:#175baf;font-size:13px">Install App</button><div>Elevor360D</div><h1>🧠 Memory Match</h1><div>Flip • Match • Win!</div></header><section class="controls"><label>Difficulty <select id="level"><option value="4">Easy – 4 pairs</option><option value="6">Medium – 6 pairs</option><option value="10">Hard – 10 pairs</option><option value="15">Expert – 15 pairs</option></select></label><label>Theme <select id="theme"></select></label><label><input type="checkbox" id="sound"> Sounds</label><button id="new">New Game</button></section><section><div id="stats" aria-live="polite"></div><div id="board"></div><div id="best"></div></section><p>Turn over two cards. Find all the matching pairs! Play as a passenger, not while driving.</p><section id="ads" hidden><small>Parent information</small><div id="adbody"></div><button id="prev">Previous</button> <button id="next">Next</button></section></main><dialog id="win"><div class="star">🏆</div><h2>Fantastic! You win!</h2><p id="result"></p><button id="again">Play again</button> <button id="close">Close</button></dialog><script>
const themes={Animals:'🐶 🐱 🐭 🐹 🐰 🦊 🐻 🐼 🐨 🐯 🦁 🐮 🐷 🐸 🐵',Vehicles:'🚗 🚕 🚌 🚎 🏎️ 🚓 🚑 🚒 🚚 🚜 🚲 🛵 🚂 ✈️ 🚁',Dinosaurs:'🦖 🦕 🥚 🌋 🦴 🦎 🐊 🐾 🌴 🪨 ☄️ 🦣 🐢 🐉 🌿',Fruit:'🍎 🍐 🍊 🍋 🍌 🍉 🍇 🍓 🫐 🍒 🍑 🥭 🍍 🥝 🍈','Sea creatures':'🐠 🐟 🐡 🦈 🐬 🐳 🐋 🐙 🦑 🦀 🦞 🦐 🪼 🦭 🐚'};const $=id=>document.getElementById(id);for(const k of [...Object.keys(themes),'Mixed'])$('theme').add(new Option(k,k));const key='e360-memory-v1';let s,first=null,second=null,lock=false,timeout, deferred;function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch{}}function fresh(){clearTimeout(timeout);first=second=null;lock=false;let n=+$('level').value,t=$('theme').value,pool=t==='Mixed'?[...new Set(Object.values(themes).join(' ').split(' '))]:themes[t].split(' ');let a=shuffle(pool).slice(0,n);s={n,t,cards:shuffle([...a,...a]),matched:[],moves:0,seconds:0,sound:$('sound').checked,started:false};save();render()}function tone(){if(!s.sound)return;try{let c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=660;g.gain.value=.07;o.start();o.stop(c.currentTime+.13);o.onended=()=>c.close()}catch{}}function stats(){ $('stats').textContent=`Pairs: ${s.matched.length/2}/${s.n} • Moves: ${s.moves} • Time: ${Math.floor(s.seconds/60)}:${String(s.seconds%60).padStart(2,'0')}`;let b;try{b=localStorage.getItem(key+'best'+s.n+s.t)}catch{}$('best').textContent=b?'Personal best: '+b+' moves':'Find your personal best!'}function render(){let b=$('board');b.style.gridTemplateColumns=`repeat(${s.n===4?4:s.n===6?4:s.n===10?5:6},1fr)`;b.replaceChildren();s.cards.forEach((v,i)=>{let m=s.matched.includes(i),open=m||i===first||i===second,el=document.createElement('button');el.className='tile'+(m?' matched':open?' open':'');el.textContent=open?v:'?';el.disabled=m||open;el.setAttribute('aria-label',open?v:'Hidden card '+(i+1));el.onclick=()=>flip(i);b.append(el)});stats()}function flip(i){if(lock||s.matched.includes(i)||i===first)return;s.started=true;if(first===null){first=i;render();save();return}second=i;s.moves++;lock=true;render();save();let match=s.cards[first]===s.cards[second];timeout=setTimeout(()=>{if(match){s.matched.push(first,second);tone()}first=second=null;lock=false;save();render();if(s.matched.length===s.cards.length){let k=key+'best'+s.n+s.t;try{let old=+localStorage.getItem(k);if(!old||s.moves<old)localStorage.setItem(k,s.moves)}catch{}stats();$('result').textContent=`You found ${s.n} pairs in ${s.moves} moves!`;if(!$('win').open)$('win').showModal()}},match?350:850)}try{s=JSON.parse(localStorage.getItem(key))}catch{}if(s&&themes[s.t]||s&&s.t==='Mixed'){ $('level').value=s.n;$('theme').value=s.t;$('sound').checked=s.sound;render()}else fresh();$('new').onclick=()=>{if(!s.started||s.matched.length===s.cards.length||confirm('Start a new game?'))fresh()};$('again').onclick=()=>{$('win').close();fresh()};$('close').onclick=()=>$('win').close();$('sound').onchange=()=>{s.sound=$('sound').checked;save()};for(let id of ['level','theme'])$(id).onchange=()=>{if(!s.started||s.matched.length===s.cards.length||confirm('Start a new game with these settings?'))fresh();else{$('level').value=s.n;$('theme').value=s.t}};setInterval(()=>{if(s.started&&s.matched.length<s.cards.length&&!document.hidden){s.seconds++;stats();save()}},1000);window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e});$('install').onclick=async()=>{if(deferred){await deferred.prompt();deferred=null}else alert('In Chrome or Edge, open the browser menu and choose Install app or Add to Home screen. On iPhone, use Safari → Share → Add to Home Screen.')};window.addEventListener('appinstalled',()=>$('install').hidden=true);if(matchMedia('(display-mode: standalone)').matches)$('install').hidden=true;if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
